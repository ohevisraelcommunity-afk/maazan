name: עדכון מחירי השקעות

on:
  schedule:
    - cron: "10 7,14,17,21 * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: משיכת מחירים
        run: |
          cat > /tmp/prices.mjs <<'EOF'
          import fs from "fs";
          const FUNDS = { "5122627": "SPY", "5128905": "QQQ" };
          const UA = { "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36", "Accept": "application/json,text/html,*/*" };
          let old = {}; try { old = JSON.parse(fs.readFileSync("prices.json", "utf8")); } catch (e) {}
          async function get(url, h = {}) {
            const r = await fetch(url, { headers: { ...UA, ...h } });
            if (!r.ok) throw new Error(url + " -> " + r.status);
            return r;
          }
          async function yahoo(sym) {
            const j = await (await get("https://query1.finance.yahoo.com/v8/finance/chart/" + encodeURIComponent(sym) + "?range=5d&interval=1d")).json();
            const res = j.chart.result[0], m = res.meta;
            const closes = (res.indicators.quote[0].close || []).filter(v => v != null);
            const c = m.regularMarketPrice;
            let pc = closes.length >= 2 ? closes[closes.length - 2] : m.chartPreviousClose;
            if (closes.length && Math.abs(closes[closes.length - 1] - c) > 1e-9) pc = closes[closes.length - 1];
            return { c, pc, t: new Date((m.regularMarketTime || Date.now() / 1000) * 1000).toISOString() };
          }
          const out = { updated: new Date().toISOString(), idx: {}, fx: null, funds: {}, log: [] };
          for (const s of ["SPY", "QQQ"]) {
            try { out.idx[s] = await yahoo(s); } catch (e) { out.log.push(String(e)); if (old.idx && old.idx[s]) out.idx[s] = old.idx[s]; }
          }
          try { out.fx = await yahoo("ILS=X"); }
          catch (e) {
            out.log.push(String(e));
            try { const j = await (await get("https://api.frankfurter.app/latest?from=USD&to=ILS")).json(); out.fx = { c: j.rates.ILS, pc: old.fx ? old.fx.c : j.rates.ILS, t: j.date }; }
            catch (e2) { out.log.push(String(e2)); out.fx = old.fx || null; }
          }
          function pickNum(o, re) { for (const k of Object.keys(o || {})) { if (re.test(k) && typeof o[k] === "number" && o[k] > 0) return o[k]; } return null; }
          async function fundPrice(id) {
            try {
              const j = await (await get("https://mayaapi.tase.co.il/api/fund/details?fundId=" + id, { "X-Maya-With": "allow", "Accept-Language": "he-IL", "Referer": "https://maya.tase.co.il/" })).json();
              const p = pickNum(j, /^(UnitValuePrice|PurchasePrice|SellPrice|Price)$/i);
              const dk = Object.keys(j).find(k => /UnitValueValidDate|PriceDate|ValidDate/i.test(k));
              if (p) return { p, d: (j[dk] || "").slice(0, 10) || new Date().toISOString().slice(0, 10), src: "maya" };
              out.log.push("maya " + id + ": no price in " + Object.keys(j).slice(0, 30).join(","));
            } catch (e) { out.log.push(String(e)); }
            try { const y = await yahoo(id + ".TA"); if (y.c) return { p: y.c, pc: y.pc, d: y.t.slice(0, 10), src: "yahoo" }; } catch (e) { out.log.push(String(e)); }
            try {
              const html = await (await get("https://www.funder.co.il/fund/" + id)).text();
              const m = html.match(/"buyPrice"\s*:\s*"?([\d.]+)/) || html.match(/מחיר[^<]{0,20}<[^>]*>\s*([\d.,]+)/);
              if (m) return { p: parseFloat(m[1].replace(/,/g, "")), d: new Date().toISOString().slice(0, 10), src: "funder" };
              out.log.push("funder " + id + ": no price");
            } catch (e) { out.log.push(String(e)); }
            return null;
          }
          for (const [id, proxy] of Object.entries(FUNDS)) {
            const f = await fundPrice(id), prev = old.funds && old.funds[id];
            if (f) {
              if (prev && prev.p === f.p && prev.d === f.d) out.funds[id] = prev;
              else out.funds[id] = { ...f, pc: f.pc || (prev ? prev.p : undefined), ix: Object.fromEntries(Object.entries(out.idx).map(([k, v]) => [k, v.c])), fx: out.fx ? out.fx.c : null };
            } else if (prev) out.funds[id] = prev;
          }
          fs.writeFileSync("prices.json", JSON.stringify(out, null, 1));
          console.log(JSON.stringify(out, null, 1));
          EOF
          node /tmp/prices.mjs
      - name: שמירה
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git commit -m "עדכון מחירים" || exit 0
          git push
